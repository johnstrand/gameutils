name: Publish new version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: Bump version
      id: bump
      shell: pwsh
      run: |
        $projectFile = "src/GameUtils/GameUtils.csproj"
        $content = Get-Content -Raw -LiteralPath $projectFile
        if ($content -notmatch '<Version>(\d+)\.(\d+)(?:\.(\d+))?</Version>') {
          throw "Could not find valid <Version> in $projectFile"
        }

        $major = [int]$matches[1]
        $minor = [int]$matches[2]

        $minor++
        if ($minor -gt 9) {
          $major++
          $minor = 0
        }

        $newVersion = "$major.$minor.0"
        Write-Host "Updating version to $newVersion"
        $newContent = $content -replace '<Version>[^<]+</Version>', "<Version>$newVersion</Version>"
        Set-Content -LiteralPath $projectFile -Value $newContent -NoNewline

        "new_version=$newVersion" >> $env:GITHUB_OUTPUT

    - name: Build
      run: dotnet build --configuration Release

    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Commit and push version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add src/GameUtils/GameUtils.csproj
        git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
        git push origin master
        git tag "v${{ steps.bump.outputs.new_version }}"
        git push origin "v${{ steps.bump.outputs.new_version }}"

    - name: Publish
      run: dotnet nuget push "/home/runner/work/gameutils/gameutils/src/GameUtils/bin/Release/*.nupkg" --api-key "${NUGET_TOKEN}" -s https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

